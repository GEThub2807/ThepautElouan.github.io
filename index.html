            filter: brightness(0) invert(1);

            linkedin: "https://www.linkedin.com/in/elouan-thepaut",

        };

        const projectsData = 
        [
            {

            },
            {

                description: "Little cinematic to introduce myself to cinematics in UE5 .",
                tech: ["Unreal Engine"],
                category: "Unreal Engine",
                image: "Images/Projects/darkRuins.png",
                link: "https://youtu.be/ezLbBPl9CJ8?si=7RbzT3jYo7cNH5o8",

            },

        const documentsData =

                description: "Complete game design document for an open-world RPG with progression system.",
                date: "December 2024",
                link: "#",
                type: "GDD",
                icon: "📘"
            },
            {
                id: 2,
                title: "Concept - Puzzle Game",
                description: "Innovative puzzle game concept based on time manipulation.",
                date: "November 2024",
                link: "#",
                type: "Concept",
                icon: "💡"
            }
        ];

        const levelsData = 
        [
            {
                id: 1,
                title: "Intro level puzzle game",
                description: "Blocking level for puzzle game using magnet system (relycta system)",
                date: "Februar 2026",
                link: "#",

            linkedin: "Images/Icons/linkedIn.png",
            mail: "Images/Icons/mail.jpg",
            cpp: "Images/Icons/cpp.png",
            unity: "Images/Icons/unity.png",
            unreal: "Images/Icons/unreal.png"
        }

        // Variables globales
        let activeTab = 'profile';
        let activeFilter = 'all';
        let activeDocFilter = 'all';
        let activeLevelFilter = 'all';

        // Fonctions de rendu
        function renderHeader() 
        {
            return `
                <header class="bg-black/30 backdrop-blur-md border-b border-purple-500/20 sticky top-0 z-50">
                    <div class="container mx-auto px-6 py-4">
                        <h1 class="text-2xl font-bold text-white">${profileData.name}</h1>
                    </div>
                </header>
            `;
        }

        function renderNav() 
        {
            const tabs = 
            [
                { id: 'profile', label: 'Profile', icon: '👤' },
                { id: 'projects', label: 'Projects', icon: '💻' },
                //{ id: 'documents', label: 'Game Concepts', icon: '📄' },
                //{ id: 'levels', label: 'Level Designs', icon: '🏞️' }
            ];

            return `
                <nav class="bg-black/20 backdrop-blur-sm border-b border-purple-500/10">
                    <div class="container mx-auto px-6">
                        <div class="flex gap-8">
                            ${tabs.map(tab => `
                                <button
                                    onclick="changeTab('${tab.id}')"
                                    class="py-4 px-2 border-b-2 transition-colors ${
                                        activeTab === tab.id
                                            ? 'border-purple-500 text-white'
                                            : 'border-transparent text-gray-400 hover:text-white'
                                    }"
                                >
                                    <div class="flex items-center gap-2">

                                    </div>

        function renderProfile()

            return `

                    <div class="bg-white/5 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/20">
                        <div class="flex flex-col md:flex-row gap-8 items-center md:items-start">
                            <img
                                src="${profileData.photo}"
                                alt="${profileData.name}"
                                class="w-40 h-40 rounded-full border-4 border-purple-500/50 object-cover"
                            />
                            <div class="flex-1 text-center md:text-left">
                                <h2 class="text-4xl font-bold text-white mb-2">${profileData.name}</h2>
                                <p class="text-xl text-purple-400 mb-4">${profileData.title}</p>
                                <p class="text-gray-300 leading-relaxed mb-6">${profileData.bio}</p>
                                
                                <div class="flex gap-4 justify-center md:justify-start mt-6">
                                    <a href="mailto:${profileData.email}" 
                                    class="p-3 bg-purple-600/20 hover:bg-purple-600/40 rounded-lg transition-colors flex items-center justify-center w-12 h-12">
                                        <img src="${logoIcons.mail}" 
                                            alt="Mail" 
                                            class="w-6 h-6 object-contain" 
                                        />
                                    </a>
                                    <a href="${profileData.github}" 
                                    target="_blank" 
                                    class="p-3 bg-purple-600/20 hover:bg-purple-600/40 rounded-lg transition-colors flex items-center justify-center w-12 h-12">
                                        <img src="${logoIcons.github}" 
                                            alt="GitHub" 
                                            class="w-6 h-6 object-contain" 
                                        />
                                    </a>
                                    <a href="${profileData.linkedin}" 
                                    target="_blank" 
                                    class="p-3 bg-purple-600/20 hover:bg-purple-600/40 rounded-lg transition-colors flex items-center justify-center w-12 h-12">
                                        <img src="${logoIcons.linkedin}" 
                                            alt="LinkedIn" 
                                            class="w-6 h-6 object-contain" 
                                        />
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-8 bg-white/5 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/20">
                        <h3 class="text-2xl font-bold text-white mb-4">Skills</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="text-lg font-semibold text-purple-400 mb-3">Languages</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${['C++', 'C#', 'HLSL', 'Python'].map(skill => `
                                        <span class="px-4 py-2 bg-purple-600/20 text-purple-300 rounded-lg border border-purple-500/30">
                                            ${skill}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h4 class="text-lg font-semibold text-purple-400 mb-3">Tools</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${['Unreal Engine', 'Unity', 'Git', 'Visual Studio'].map(tool => `
                                        <span class="px-4 py-2 bg-purple-600/20 text-purple-300 rounded-lg border border-purple-500/30">

        function renderProjects() 
        {
            // Filtrer les projets selon la catégorie active
            const filteredProjects = activeFilter === 'all' 
                ? projectsData 
                : projectsData.filter(project => project.category === activeFilter);

            // Obtenir toutes les catégories uniques
            const categories = [
                { id: 'all', label: 'All projects', icon: '📁' },
                { id: 'C++', label: 'C++', icon: 'cpp' },
                { id: 'Unity', label: 'Unity', icon: 'unity' },
                { id: 'Unreal Engine', label: 'Unreal Engine', icon: 'unreal' }
            ];
            
            return `
                <div>
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-white">My projects</h2>
                        <p class="text-gray-400 mt-2">Filter by engine :</p>
                    </div>
                    
                    <!-- Filtres avec logos -->
                    <div class="mb-8 flex flex-wrap gap-4">
                        ${categories.map(cat => `
                            <button
                                onclick="changeFilter('${cat.id}')"
                                class="px-5 py-3 rounded-lg transition-colors flex items-center gap-3 ${
                                    activeFilter === cat.id
                                        ? 'bg-purple-600 text-white border-2 border-purple-400 shadow-lg shadow-purple-500/30'
                                        : 'bg-purple-600/20 text-purple-300 border border-purple-500/30 hover:bg-purple-600/40 hover:border-purple-500/50'
                                }"
                            >
                                ${cat.id === 'all' 
                                    ? '<span class="text-lg">📁</span>' 
                                    : `<img src="${logoIcons[cat.icon]}" 
                                        alt="${cat.label}" 
                                        class="w-6 h-6 object-contain ${activeFilter === cat.id ? 'brightness-100' : 'brightness-50'}" 
                                    />`
                                }
                                <span class="font-medium">${cat.label}</span>
                                ${cat.id !== 'all' ? `
                                    <span class="ml-1 px-2 py-0.5 bg-purple-500/30 text-xs rounded-full">
                                        ${projectsData.filter(p => p.category === cat.id).length}
                                    </span>
                                ` : ''}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Compteur de projets -->
                    <div class="mb-6">
                        <p class="text-purple-400">
                            ${filteredProjects.length} project${filteredProjects.length > 1 ? 's' : ''} 
                            ${activeFilter !== 'all' ? `in ${activeFilter}` : ''}
                        </p>
                    </div>

                    <!-- Liste des projets -->
                    ${filteredProjects.length > 0 ? `
                        <div class="grid md:grid-cols-2 gap-8">
                            ${filteredProjects.map(project => `
                                <div class="bg-white/5 backdrop-blur-lg rounded-2xl overflow-hidden border border-purple-500/20 hover:border-purple-500/40 transition-all hover:transform hover:scale-105">
                                    <img src="${project.image}" alt="${project.title}" class="w-full h-48 object-cover" />
                                    <div class="p-6">
                                        <div class="flex items-start justify-between mb-2">
                                            <h3 class="text-xl font-bold text-white">${project.title}</h3>
                                            <div class="flex items-center gap-2">
                                                <img src="${logoIcons[project.category.toLowerCase().replace(' ', '')] || ''}" 
                                                    alt="${project.category}" 
                                                    class="w-5 h-5 object-contain" 
                                                />
                                                <span class="px-2 py-1 bg-purple-600/30 text-purple-300 rounded text-xs font-medium">
                                                    ${project.category}
                                                </span>
                                            </div>
                                        </div>
                                        <p class="text-sm text-purple-400 mb-3">${project.year}</p>
                                        <p class="text-gray-300 mb-4">${project.description}</p>
                                        <div class="flex flex-wrap gap-2 mb-4">
                                            ${project.tech.map(tech => `
                                                <span class="px-3 py-1 bg-purple-600/30 text-purple-300 rounded-full text-sm">
                                                    ${tech}
                                                </span>
                                            `).join('')}
                                        </div>
                                        ${project.link ? `
                                            <a href="${project.link}" class="inline-flex items-center gap-2 text-purple-400 hover:text-purple-300 transition-colors">

                                            </a>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : `
                        <div class="text-center py-12">
                            <div class="text-6xl mb-4">🔍</div>
                            <h3 class="text-xl font-bold text-white mb-2">No project found</h3>
                            <p class="text-gray-400">No project matches the filter "${activeFilter}"</p>
                            <button 
                                onclick="changeFilter('all')"
                                class="mt-4 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors"
                            >

                            </button>
                        </div>

            `;
        }

        function renderDocuments() 
        {
            // Filtrer les documents selon le type actif
            const filteredDocuments = activeDocFilter === 'all' 
                ? documentsData 
                : documentsData.filter(doc => doc.type === activeDocFilter);

            // Catégories de documents
            const docCategories = [
                { id: 'all', label: 'All documents', icon: '📁', color: 'text-gray-300' },
                { id: 'GDD', label: 'Game Design Documents', icon: '📘', color: 'text-blue-400' },
                { id: 'Concept', label: 'Game Concepts', icon: '💡', color: 'text-yellow-400' }
            ];

            // Compter les documents par type
            const gddCount = documentsData.filter(doc => doc.type === 'GDD').length;
            const conceptCount = documentsData.filter(doc => doc.type === 'Concept').length;
            
            return `
                <div>
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-white">Game Concepts & Documents</h2>
                        <p class="text-gray-400 mt-2">Filter by document type :</p>
                    </div>
                    
                    <!-- Filtres documents -->
                    <div class="mb-8 flex flex-wrap gap-4">
                        ${docCategories.map(cat => {
                            const isActive = activeDocFilter === cat.id;
                            const count = cat.id === 'all' ? documentsData.length : 
                                        cat.id === 'GDD' ? gddCount : conceptCount;
                            
                            return `
                                <button
                                    onclick="changeDocFilter('${cat.id}')"
                                    class="px-5 py-3 rounded-lg transition-all flex items-center gap-3 ${
                                        isActive
                                            ? 'bg-purple-600 text-white border-2 border-purple-400 shadow-lg shadow-purple-500/30'
                                            : 'bg-purple-600/20 text-purple-300 border border-purple-500/30 hover:bg-purple-600/40 hover:border-purple-500/50'
                                    }"
                                >
                                    <span class="text-xl ${isActive ? 'text-white' : cat.color}">${cat.icon}</span>
                                    <span class="font-medium">${cat.label}</span>
                                    <span class="ml-1 px-2 py-0.5 ${isActive ? 'bg-white/20' : 'bg-purple-500/30'} text-xs rounded-full">
                                        ${count}
                                    </span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- Compteur de documents -->
                    <div class="mb-6">
                        <p class="text-purple-400">
                            ${filteredDocuments.length} document${filteredDocuments.length > 1 ? 's' : ''} 
                            ${activeDocFilter === 'GDD' ? 'of Game Design' : 
                            activeDocFilter === 'Concept' ? 'of Concepts' : ''}
                        </p>
                    </div>

                    <!-- Liste des documents -->
                    ${filteredDocuments.length > 0 ? `
                        <div class="max-w-4xl mx-auto space-y-6">
                            ${filteredDocuments.map(doc => {
                                const isGDD = doc.type === 'GDD';
                                const typeColor = isGDD ? 'border-blue-500/30 bg-blue-500/10' : 'border-yellow-500/30 bg-yellow-500/10';
                                const iconColor = isGDD ? 'text-blue-400' : 'text-yellow-400';
                                const typeText = isGDD ? 'GDD' : 'Concept';
                                
                                return `
                                    <div class="bg-white/5 backdrop-blur-lg rounded-xl p-6 border border-purple-500/20 hover:border-purple-500/40 transition-all group">
                                        <div class="flex items-start justify-between flex-wrap gap-4">
                                            <div class="flex gap-4 flex-1">
                                                <div class="p-3 ${typeColor} rounded-lg group-hover:scale-105 transition-transform">
                                                    <span class="${iconColor} text-2xl">${doc.icon}</span>
                                                </div>
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-3 mb-2">
                                                        <h3 class="text-xl font-bold text-white">${doc.title}</h3>
                                                        <span class="px-2 py-1 ${isGDD ? 'bg-blue-500/30 text-blue-300' : 'bg-yellow-500/30 text-yellow-300'} rounded text-xs font-medium">
                                                            ${typeText}
                                                        </span>
                                                    </div>
                                                    <p class="text-sm text-purple-400 mb-2">${doc.date}</p>
                                                    <p class="text-gray-300">${doc.description}</p>
                                                </div>
                                            </div>
                                            <a href="${doc.link}" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors inline-flex items-center gap-2 whitespace-nowrap">
                                                Download →
                                            </a>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : `
                        <div class="text-center py-12">
                            <div class="text-6xl mb-4">📄</div>
                            <h3 class="text-xl font-bold text-white mb-2">No document found</h3>
                            <p class="text-gray-400">No document matches the filter "${activeDocFilter === 'GDD' ? 'Game Design Documents' : 'Game Concepts'}"</p>
                            <button 
                                onclick="changeDocFilter('all')"
                                class="mt-4 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors"
                            >
                                See all documents
                            </button>
                        </div>
                    `}
                </div>
            `;
        }

        function renderLevels() 
        {
            const filteredLevels = activeLevelFilter === 'all' 
                ? levelsData 
                : levelsData.filter(level => level.type === activeLevelFilter);

            // Catégories de documents
            const levelCategories = [
                { id: 'all', label: 'All level documents', icon: '📁', color: 'text-gray-300' },
                { id: 'Blocking', label: 'Blocking levels', icon: '📘', color: 'text-blue-400' },
                { id: 'ArtPass', label: 'Art Passed levels', icon: '💡', color: 'text-yellow-400' }
            ];

            // Compter les documents par type
            const blockingCount = levelsData.filter(level => level.type === 'Blocking').length;
            const artPassedCount = levelsData.filter(level => level.type === 'ArtPassed').length;
            
            return `
                <div>
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-white">Level Design Documents</h2>
                        <p class="text-gray-400 mt-2">Filter by level design document type :</p>
                    </div>
                    
                    <!-- Filtres documents -->
                    <div class="mb-8 flex flex-wrap gap-4">
                        ${docCategories.map(cat => {
                            const isActive = activeLevelFilter === cat.id;
                            const count = cat.id === 'all' ? levelsData.length : 
                                        cat.id === 'Blocking' ? blockingCount : artPassedCount;
                            
                            return `
                                <button
                                    onclick="changeDocFilter('${cat.id}')"
                                    class="px-5 py-3 rounded-lg transition-all flex items-center gap-3 ${
                                        isActive
                                            ? 'bg-purple-600 text-white border-2 border-purple-400 shadow-lg shadow-purple-500/30'
                                            : 'bg-purple-600/20 text-purple-300 border border-purple-500/30 hover:bg-purple-600/40 hover:border-purple-500/50'
                                    }"
                                >
                                    <span class="text-xl ${isActive ? 'text-white' : cat.color}">${cat.icon}</span>
                                    <span class="font-medium">${cat.label}</span>
                                    <span class="ml-1 px-2 py-0.5 ${isActive ? 'bg-white/20' : 'bg-purple-500/30'} text-xs rounded-full">
                                        ${count}
                                    </span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- Compteur de documents -->
                    <div class="mb-6">
                        <p class="text-purple-400">
                            ${filteredLevels.length} document${filteredLevels.length > 1 ? 's' : ''} 
                            ${activeLevelFilter === 'Blocking' ? 'of blocking levels' : 
                            activeLevelFilter === 'ArtPassed' ? 'of art passed levels' : ''}
                        </p>
                    </div>

                    <!-- Liste des documents -->
                    ${filteredLevels.length > 0 ? `
                        <div class="max-w-4xl mx-auto space-y-6">
                            ${filteredLevels.map(doc => {
                                const isGDD = doc.type === 'Blocking';
                                const typeColor = isGDD ? 'border-blue-500/30 bg-blue-500/10' : 'border-yellow-500/30 bg-yellow-500/10';
                                const iconColor = isGDD ? 'text-blue-400' : 'text-yellow-400';
                                const typeText = isGDD ? 'Blocking' : 'ArtPassed';
                                
                                return `
                                    <div class="bg-white/5 backdrop-blur-lg rounded-xl p-6 border border-purple-500/20 hover:border-purple-500/40 transition-all group">
                                        <div class="flex items-start justify-between flex-wrap gap-4">
                                            <div class="flex gap-4 flex-1">
                                                <div class="p-3 ${typeColor} rounded-lg group-hover:scale-105 transition-transform">
                                                    <span class="${iconColor} text-2xl">${level.icon}</span>
                                                </div>
                                                <div class="flex-1">
                                                    <div class="flex items-center gap-3 mb-2">
                                                        <h3 class="text-xl font-bold text-white">${level.title}</h3>
                                                        <span class="px-2 py-1 ${isGDD ? 'bg-blue-500/30 text-blue-300' : 'bg-yellow-500/30 text-yellow-300'} rounded text-xs font-medium">
                                                            ${typeText}
                                                        </span>
                                                    </div>
                                                    <p class="text-sm text-purple-400 mb-2">${doc.date}</p>
                                                    <p class="text-gray-300">${level.description}</p>
                                                </div>
                                            </div>
                                            <a href="${level.link}" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors inline-flex items-center gap-2 whitespace-nowrap">
                                                Download →
                                            </a>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    ` : `
                        <div class="text-center py-12">
                            <div class="text-6xl mb-4">📄</div>
                            <h3 class="text-xl font-bold text-white mb-2">No document found</h3>
                            <p class="text-gray-400">No level design document matches the filter "${activeLevelFilter === 'GDD' ? 'Game Design Documents' : 'Game Concepts'}"</p>
                            <button 
                                onclick="changeDocFilter('all')"
                                class="mt-4 px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors"
                            >
                                See all documents
                            </button>
                        </div>
                    `}
                </div>
            `;
        }

        function renderMain() 
        {
            let content = '';
            if (activeTab === 'profile') content = renderProfile();
            else if (activeTab === 'projects') content = renderProjects();
            else if (activeTab === 'documents') content = renderDocuments();
            else if (activeTab === 'levels') content = renderLevels();

            return `
                <main class="container mx-auto px-6 py-12">
                    ${content}
                </main>
            `;
        }

        function renderFooter() 
        {
            return `
                <footer class="bg-black/30 backdrop-blur-md border-t border-purple-500/20 mt-20">
                    <div class="container mx-auto px-6 py-8">
                        <p class="text-center text-gray-400">
                            © 2025 ${profileData.name}. Portfolio made to keep in mind where we come from. Peace
                        </p>
                    </div>
                </footer>
            `;
        }

        function render() 
        {
            const app = `
                <div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
                    ${renderHeader()}
                    ${renderNav()}
                    ${renderMain()}
                    ${renderFooter()}
                </div>
            `;
            document.getElementById('root').innerHTML = app;
        }

        function changeTab(tab) 
        {
            activeTab = tab;
            activeFilter = 'all'; // Réinitialiser le filtre projets
            activeDocFilter = 'all'; // Réinitialiser le filtre documents
            render();
        }

        function changeFilter(filter) 
        {
            activeFilter = filter;
            render();
        }

        function changeDocFilter(filter) 
        {
            activeDocFilter = filter;
            render();
        }

        function changeLevelFilter(filter) 
        {
            activeLevelFilter = filter;
            render();
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', render);
        render();
    </script>
</body>
</html>
