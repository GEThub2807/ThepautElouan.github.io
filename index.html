<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THEPAUT Elouan - Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Configuration des données
        const profileData = 
        {
            name: "THEPAUT Elouan",
            title: "Gameplay Developer / Game Designer",
            bio: "Third-year video game development student, specializing in C++ and C#. Passionate about level design, resolving code issues and making cool games.",
            email: "e.thepaut28@gmail.com",
            github: "https://github.com/GEThub2807",
            linkedin: "https://www.linkedin.com/in/elouan-thepaut",
            photo: "Images/THEPAUTElouanPic.jpg"
        };

        const projectsData = 
        [
            {
                id: 1,
                title: "Platformer 2D",
                description: "Jeu de plateforme développé en Unity avec C#. Système de physiques personnalisé et mécaniques de mouvement fluides.",
                tech: ["Unity", "C#", "Git"],
                image: "https://via.placeholder.com/400x250/8b5cf6/ffffff?text=Platformer+2D",
                link: "",
                year: "2024"
            },
            {
                id: 2,
                title: "Moteur de Jeu 3D",
                description: "Moteur graphique développé en C++ avec OpenGL. Rendu 3D, gestion de scènes et système d'entités-composants.",
                tech: ["C++", "OpenGL", "GLSL"],
                image: "https://via.placeholder.com/400x250/8b5cf6/ffffff?text=Moteur+3D",
                link: "",
                year: "2023"
            }
        ];

        const documentsData = 
        [
            {
                id: 1,
                title: "GDD - RPG Fantasy",
                description: "Document de game design complet pour un RPG en monde ouvert avec système de progression.",
                date: "Décembre 2024",
                link: "#"
            },
            {
                id: 2,
                title: "Concept - Puzzle Game",
                description: "Concept de jeu de puzzle innovant basé sur la manipulation du temps.",
                date: "Novembre 2024",
                link: "#"
            }
        ];

        const logoIcons = 
        {
            github: "Images/Icons/github.png",
            linkedin: "Images/Icons/linkedIn.png",
            mail: "Images/Icons/mail.jpg"
        }

        // Variables globales
        let activeTab = 'profile';

        // Fonctions de rendu
        function renderHeader() 
        {
            return `
                <header class="bg-black/30 backdrop-blur-md border-b border-purple-500/20 sticky top-0 z-50">
                    <div class="container mx-auto px-6 py-4">
                        <h1 class="text-2xl font-bold text-white">${profileData.name}</h1>
                    </div>
                </header>
            `;
        }

        function renderNav() 
        {
            const tabs = 
            [
                { id: 'profile', label: 'Profil', icon: '👤' },
                { id: 'projects', label: 'Projets', icon: '💻' },
                { id: 'documents', label: 'Game Concepts', icon: '📄' }
            ];

            return `
                <nav class="bg-black/20 backdrop-blur-sm border-b border-purple-500/10">
                    <div class="container mx-auto px-6">
                        <div class="flex gap-8">
                            ${tabs.map(tab => `
                                <button
                                    onclick="changeTab('${tab.id}')"
                                    class="py-4 px-2 border-b-2 transition-colors ${
                                        activeTab === tab.id
                                            ? 'border-purple-500 text-white'
                                            : 'border-transparent text-gray-400 hover:text-white'
                                    }"
                                >
                                    <div class="flex items-center gap-2">
                                        <span>${tab.icon}</span>
                                        ${tab.label}
                                    </div>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                </nav>
            `;
        }

        function renderProfile() 
        {
            return `
                <div class="max-w-4xl mx-auto">
                    <div class="bg-white/5 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/20">
                        <div class="flex flex-col md:flex-row gap-8 items-center md:items-start">
                            <img
                                src="${profileData.photo}"
                                alt="${profileData.name}"
                                class="w-40 h-40 rounded-full border-4 border-purple-500/50 object-cover"
                            />
                            <div class="flex-1 text-center md:text-left">
                                <h2 class="text-4xl font-bold text-white mb-2">${profileData.name}</h2>
                                <p class="text-xl text-purple-400 mb-4">${profileData.title}</p>
                                <p class="text-gray-300 leading-relaxed mb-6">${profileData.bio}</p>
                                
                                <div class="flex gap-4 justify-center md:justify-start mt-6">
                                    <a href="mailto:${profileData.email}" 
                                    class="p-3 bg-purple-600/20 hover:bg-purple-600/40 rounded-lg transition-colors flex items-center justify-center w-12 h-12">
                                        <img src="${logoIcons.mail}" 
                                            alt="Mail" 
                                            class="w-6 h-6 object-contain" />
                                    </a>
                                    <a href="${profileData.github}" 
                                    target="_blank" 
                                    class="p-3 bg-purple-600/20 hover:bg-purple-600/40 rounded-lg transition-colors flex items-center justify-center w-12 h-12">
                                        <img src="${logoIcons.github}" 
                                            alt="GitHub" 
                                            class="w-6 h-6 object-contain" />
                                    </a>
                                    <a href="${profileData.linkedin}" 
                                    target="_blank" 
                                    class="p-3 bg-purple-600/20 hover:bg-purple-600/40 rounded-lg transition-colors flex items-center justify-center w-12 h-12">
                                        <img src="${logoIcons.linkedin}" 
                                            alt="LinkedIn" 
                                            class="w-6 h-6 object-contain" />
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-8 bg-white/5 backdrop-blur-lg rounded-2xl p-8 border border-purple-500/20">
                        <h3 class="text-2xl font-bold text-white mb-4">Compétences</h3>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <h4 class="text-lg font-semibold text-purple-400 mb-3">Langages</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${['C++', 'C#', 'Python', 'GLSL'].map(skill => `
                                        <span class="px-4 py-2 bg-purple-600/20 text-purple-300 rounded-lg border border-purple-500/30">
                                            ${skill}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                            <div>
                                <h4 class="text-lg font-semibold text-purple-400 mb-3">Outils</h4>
                                <div class="flex flex-wrap gap-2">
                                    ${['Unity', 'Unreal Engine', 'Git', 'Visual Studio'].map(tool => `
                                        <span class="px-4 py-2 bg-purple-600/20 text-purple-300 rounded-lg border border-purple-500/30">
                                            ${tool}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDocuments() 
        {
            return `
                <div>
                    <div class="mb-8">
                        <h2 class="text-3xl font-bold text-white">Game Concepts & Documents</h2>
                    </div>
                    <div class="max-w-4xl mx-auto space-y-4">
                        ${documentsData.map(doc => `
                            <div class="bg-white/5 backdrop-blur-lg rounded-xl p-6 border border-purple-500/20 hover:border-purple-500/40 transition-all">
                                <div class="flex items-start justify-between flex-wrap gap-4">
                                    <div class="flex gap-4 flex-1">
                                        <div class="p-3 bg-purple-600/20 rounded-lg">
                                            <span class="text-purple-400 text-2xl">📄</span>
                                        </div>
                                        <div class="flex-1">
                                            <h3 class="text-xl font-bold text-white mb-1">${doc.title}</h3>
                                            <p class="text-sm text-purple-400 mb-2">${doc.date}</p>
                                            <p class="text-gray-300">${doc.description}</p>
                                        </div>
                                    </div>
                                    <a href="${doc.link}" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg transition-colors inline-flex items-center gap-2">
                                        Télécharger →
                                    </a>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderMain() 
        {
            let content = '';
            if (activeTab === 'profile') content = renderProfile();
            else if (activeTab === 'projects') content = renderProjects();
            else if (activeTab === 'documents') content = renderDocuments();

            return `
                <main class="container mx-auto px-6 py-12">
                    ${content}
                </main>
            `;
        }

        function renderFooter() 
        {
            return `
                <footer class="bg-black/30 backdrop-blur-md border-t border-purple-500/20 mt-20">
                    <div class="container mx-auto px-6 py-8">
                        <p class="text-center text-gray-400">
                            © 2025 ${profileData.name}. Portfolio développé avec ❤️
                        </p>
                    </div>
                </footer>
            `;
        }

        function render() 
        {
            const app = `
                <div class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900">
                    ${renderHeader()}
                    ${renderNav()}
                    ${renderMain()}
                    ${renderFooter()}
                </div>
            `;
            document.getElementById('root').innerHTML = app;
        }

        function changeTab(tab) 
        {
            activeTab = tab;
            render();
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', render);
        render();
    </script>
</body>
</html>
